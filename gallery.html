<!DOCTYPE html>
<html>
    <head>
        <title>EDINBURGH - Gallery</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- Navigation Bar -->
        <nav>
            <a href="index.html">Home</a> |
            <a href="places.html">Places to Visit</a> |
            <a href="tips.html">Food & Travel Tips</a> |
            <a href="gallery.html">Gallery</a>
        </nav>

        <h1>Edinburgh Photo Gallery</h1>

        <!-- Block of Images -->
        <div class="gallery-block">
            <img src="images/postcard.png" alt="Edinburgh Postcard" onclick="showCaption('Edinburgh Vintage Postcard')">
            <img src="images/map.png.jpg" alt="Edinburgh Map" onclick="showCaption('City Map of Edinburgh')">
            <img src="images/castle.jpg" alt="Edinburgh Castle" onclick="showCaption('Edinburgh Castle on Castle Rock')">
            <img src="images/dean.jpg" alt="Dean Village" onclick="showCaption('Historic Dean Village along the Water of Leith')">
        </div>

        <p id="caption-text">Click on any image to view its description.</p>

        <script>
            function showCaption(description) {
                document.getElementById("caption-text").innerText = description;
            }
        </script>
    </body>
</html>
